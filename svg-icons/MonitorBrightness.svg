<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="32" height="32">
    <style type="text/css" id="current-color-scheme">.ColorScheme-Accent { color: #3DAEE6; } .ColorScheme-Background { color: #2a2e32; } .ColorScheme-ButtonText { color: #7B7C7E; } .ColorScheme-Text { color: #6b7280; }</style>
    <!-- Round 65: whole composite shifted up - measured bbox (128px
         render, scale 4) was y:[6.75,32.0] in the 32-unit canvas, meaning
         a 6.75-unit top margin against a 0 bottom margin (the foot sat
         flush on the canvas edge) - exactly the "downsided" look reported
         against the level, evenly-margined system icons next to it.
         Balancing the two margins to ~3.375 each needs the whole glyph to
         move up by 3.375 units in final canvas space, which is 3.375 /
         1.09091 ≈ 3.0937 in this group's own local space (translate-y
         reduced from 34.0113 to 30.9176). -->
    <g transform="matrix(1.09091,0,0,1.09091,-420.98739,-597.79142) translate(-4.4589e-06,30.9176)" id="video-display-brightness">
    <rect y="516.79803" x="385.90479" height="29.333271" width="29.333307" id="rect3018" style="opacity:0.01000001;fill:#00000f;fill-opacity:0.00392157;stroke:none"/>
    <!-- Round 64: bezel thinned from the original's ~0.92 top/side inset
         (and a much heavier ~3.67 bottom "chin") down to a uniform 0.4 on
         all four sides - a 2026 monitor doesn't have a thick bottom chin.
         Only the screen-cutout subpath's inset/size changed; the outer
         rect and the stand are untouched. -->
    <!-- Round 64, continued: "half the stem" meant thickness, not height -
         corrected. Neck width halved from 5.33332 to 2.66666, re-centered
         on the same x (400.57145) the monitor and the original neck both
         already shared, height and vertical position back to the
         original (the earlier height-based edit and its monitor-shift
         compensation are both reverted here). Foot (subpath 1) untouched
         throughout - never edited. Bottom bezel still doubled (0.4 top/
         left/right, 0.8 bottom) from the previous edit, independent of
         this one - the outer rect and screen cutout land at the exact
         same position as before this edit, just reached via a different
         (compensating) moveto delta in subpath 3 since the neck's own
         start point shifted right by 1.33333 when it was re-centered. -->
    <!-- Round 65: real feedback against the actual tray - lines read
         thinner/grayer than the neighboring system icons at real size.
         Rather than hand-recompute three separate geometries (bezel inset,
         stand width/height, sun path) to "double" each one, a stroke is
         added on top of the existing fill instead - grows every edge
         uniformly by the same amount without touching the underlying
         shape math. stroke-width chosen empirically (rendered and
         measured, not guessed) to read as roughly doubled at tray size. -->
    <path sodipodi:nodetypes="cccccccccccccccccccc" inkscape:connector-curvature="0" class="ColorScheme-Text" d="m 394.15479,542.47502 12.83332,0 0,0.91666 -12.83332,0 z m 5.08333,-2.74998 2.66666,0 0,2.74996 -2.66666,0 z m -11.49999,-19.25001 0,19.24999 25.66664,0 0,-19.24999 z m 0.4,0.4 24.86664,0 0,18.04999 -24.86664,0 z" style="fill:currentColor;fill-opacity:1;stroke:currentColor;stroke-width:0.5;stroke-linejoin:round" id="path3020"/>
    <!-- Round 64: re-measured fresh after the bezel/stem edits, not
         accumulated by hand - rendered the sun alone at 1024x1024
         (pixel bbox 310,412,714,797) and compared its center against the
         screen rect's own analytically-computed center, both converted
         into the same final 0-32 canvas space via the outer group's
         transform. Horizontally still exactly centered (both x=16.0,
         the design's built-in symmetry, untouched by any of this).
         Vertically the sun sat 1.505625 below the screen's real center
         in that final space; translate-y corrected by that delta divided
         by the outer group's 1.09091 scale factor (-1.380155 in this
         group's own local space). -->
    <g id="g7832-8" transform="matrix(0.36250958,0,0,0.36250958,395.47692,51.8365)">
      <!-- Round 65: same stroke-on-top-of-fill treatment as path3020 above -
           stroke-width here is 0.5 (that path's value) divided by this
           group's own 0.36250958 scale (≈1.379), so the two read as the
           same visual thickness once both are rendered through their
           respective transforms into the same final canvas. -->
      <path class="ColorScheme-Text" sodipodi:nodetypes="csccccccccccccccccccccccccccccccccccccsssscs" inkscape:connector-curvature="0" style="fill:currentColor;fill-opacity:1;stroke:currentColor;stroke-width:1.379;stroke-linejoin:round" id="path6938-4-8-9-6-9" d="m 14.000014,1311.1388 c 4.1656,0 7.527,3.3769 7.527,7.5425 0,4.1656 -3.3614,7.5425 -7.527,7.5425 l 0,-7.5425 z m -4.8527,-7.5793 0.5625,5.1875 c -1.4652,0.6356 -2.7334,1.5855 -3.75,2.7188 l -4.7813,-2.125 3.5,3.9062 c -0.7932,1.3525 -1.3128,2.8566 -1.4687,4.4375 l -5.0938,1.0938 5.125,1.0937 c 0.079,0.7385 0.2303,1.4849 0.4688,2.2188 0.2392,0.7362 0.5341,1.4484 0.9062,2.0937 l -3.5,3.9063 4.7813,-2.125 c 1.0342,1.1622 2.317,2.0609 3.7187,2.6875 l -0.5625,5.25 2.6563,-4.5625 c 1.4917,0.3324 3.0591,0.3693 4.625,0.031 l 2.625,4.5 -0.5313,-5.1875 c 1.4343,-0.6331 2.6868,-1.5435 3.6875,-2.6563 l 4.8438,2.125 -3.5313,-3.9375 c 0.7678,-1.3185 1.2413,-2.8078 1.4063,-4.3437 l 5.1562,-1.0938 -5.125,-1.125 c -0.076,-0.7593 -0.2235,-1.5264 -0.4687,-2.2812 -0.2468,-0.7595 -0.5808,-1.4624 -0.9688,-2.125 l 3.5,-3.9063 -4.8125,2.125 c -1.0405,-1.1499 -2.3159,-2.0409 -3.7187,-2.6562 l 0.5625,-5.25 -2.625,4.5625 c -1.4665,-0.3187 -3.0254,-0.3586 -4.5625,-0.031 z m 4.7812,6 c 3.9111,-0.053 7.57,2.4233 8.8438,6.3438 1.5678,4.8251 -1.0811,9.9947 -5.9063,11.5625 -4.8251,1.5678 -9.9634,-1.0811 -11.5312,-5.9063 -1.5678,-4.8251 1.0498,-9.9634 5.875,-11.5312 0.9047,-0.294 1.8162,-0.4566 2.7187,-0.4688 z"/>
    </g>
  </g>
</svg>
